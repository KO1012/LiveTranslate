<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>LiveTranslate</title>
    <style>
      body {
        width: 360px;
        margin: 0;
        padding: 12px;
        color: #111827;
        font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      section + section {
        margin-top: 12px;
      }
      .label {
        margin-bottom: 4px;
        color: #2563eb;
        font-size: 12px;
      }
      .text {
        white-space: pre-wrap;
        word-break: break-word;
      }
      .error {
        color: #b91c1c;
      }
      .settings {
        margin-bottom: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid #e5e7eb;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      input {
        flex: 1;
        min-width: 0;
        padding: 6px 8px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
      }
      button {
        padding: 6px 10px;
        border: 1px solid #2563eb;
        border-radius: 6px;
        color: #fff;
        background: #2563eb;
        cursor: pointer;
      }
      .hint {
        margin-top: 6px;
        color: #6b7280;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="settings">
      <div class="label">本地 API Token</div>
      <div class="row">
        <input id="token" type="password" autocomplete="off" placeholder="未配置可留空">
        <button id="save-token" type="button">保存</button>
      </div>
      <div id="token-status" class="hint">只保存本地共享 token，不保存 API Key。</div>
    </div>
    <div id="result">暂无翻译结果</div>
    <script src="popup.js"></script>
  </body>
</html>
